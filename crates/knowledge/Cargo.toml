[package]
name = "knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Markdown retrieval, knowledge index and MCP server (C-KNOWLEDGE)"
publish = false

[features]
default = []
full = ["dep:reqwest", "dep:tokenizers"]

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
saphyr = { version = "=0.2.2", default-features = false }
saphyr-parser = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
toml = "1.1"
walkdir = "2.5"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
